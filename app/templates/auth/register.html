{% extends "base.html" %}
{% block title %}הרשמה{% endblock %}
{% block body %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h1 class="h3 mb-3">הרשמה</h1>
      <p class="text-secondary">בסביבת הקורס כל תפקיד נרשם מהטופס. בפרודקשן HR היה מוזמן.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="full_name">שם מלא</label>
          <input class="form-control" id="full_name" name="full_name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">אימייל</label>
          <input class="form-control" id="email" name="email" type="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">סיסמה (לפחות 6 תווים)</label>
          <input class="form-control" id="password" name="password" type="password" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="role">תפקיד</label>
          <select class="form-select" id="role" name="role" required>
            <option value="candidate">מועמד</option>
            <option value="hr">גיוס (HR)</option>
            <option value="hiring_manager">מנהל גיוס</option>
          </select>
        </div>
        <button class="btn btn-primary w-100" type="submit">יצירת חשבון</button>
      </form>
      <p class="mt-3 mb-0">כבר רשום? <a href="{{ url_for('auth.login') }}">כניסה</a></p>
    </div>
  </div>
</div>
{% endblock %}
