{% extends "base.html" %}
{% block title %}כניסה{% endblock %}
{% block body %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h1 class="h3 mb-3">כניסה</h1>
      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="email">אימייל</label>
          <input class="form-control" id="email" name="email" type="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">סיסמה</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">כניסה</button>
      </form>
      <p class="mt-3 mb-0">אין חשבון? <a href="{{ url_for('auth.register') }}">הרשמה</a></p>
    </div>
  </div>
</div>
{% endblock %}
